<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Degree Recommender</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/runtime-config.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/auth.js"></script>
  </head>
  <body class="page-auth">
    <div class="auth-container">
      <div class="auth-box">
        <div class="auth-logo">
          <div class="logo-icon">Degree Recommender</div>
        </div>
        <h2>Reset Password</h2>
        <p class="subtitle">Enter your registered email address to receive a password reset token.</p>

        <div class="alert alert-error" id="errorAlert" style="display:none;"></div>
        <div class="alert alert-success" id="successAlert" style="display:none;"></div>

        <div id="requestForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="name@example.com" />
          </div>

          <button class="btn btn-primary" id="submitBtn" onclick="requestReset()">Generate Reset Token</button>
        </div>

        <div id="tokenDisplay" style="display:none; margin-top:20px; padding:16px; background:rgba(99,102,241,0.1); border:1px solid #6366f1; border-radius:8px;">
          <h4 style="margin:0 0 8px 0; color:#818cf8;">Reset Token Generated</h4>
          <p style="font-size:0.85rem; margin-bottom:12px; word-break:break-all;" id="tokenText"></p>
          <button class="btn btn-secondary" onclick="proceedToReset()">Proceed to Set New Password</button>
        </div>

        <div class="auth-link" style="margin-top:20px;">
          Remembered your password?
          <a href="login.html">Back to Login</a>
        </div>
      </div>
    </div>

    <script>
      const { apiFetch } = window.AUTH_CLIENT
      let generatedToken = ''

      async function requestReset() {
        const email = document.getElementById('email').value.trim()
        const errorAlert = document.getElementById('errorAlert')
        const successAlert = document.getElementById('successAlert')
        const submitBtn = document.getElementById('submitBtn')

        errorAlert.style.display = 'none'
        successAlert.style.display = 'none'

        if (!email) {
          errorAlert.style.display = 'block'
          errorAlert.textContent = 'Please enter your email address.'
          return
        }

        try {
          submitBtn.disabled = true
          submitBtn.textContent = 'Generating...'

          const data = await apiFetch('/auth/forgot-password', {
            method: 'POST',
            body: { email },
          })

          successAlert.style.display = 'block'
          successAlert.textContent = data.message || 'Reset token generated successfully.'
          showAppAlert('Reset token generated!', 'success')

          if (data.resetToken) {
            generatedToken = data.resetToken
            document.getElementById('tokenDisplay').style.display = 'block'
            document.getElementById('tokenText').textContent = data.resetToken
          }
        } catch (error) {
          errorAlert.style.display = 'block'
          errorAlert.textContent = error.data?.message || 'Failed to generate reset token. Please try again.'
          showAppAlert(errorAlert.textContent, 'error')
        } finally {
          submitBtn.disabled = false
          submitBtn.textContent = 'Generate Reset Token'
        }
      }

      function proceedToReset() {
        if (generatedToken) {
          window.location.href = `reset-password.html?token=${encodeURIComponent(generatedToken)}`
        }
      }
    </script>
  </body>
</html>
