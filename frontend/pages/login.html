<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Degree Recommender</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/runtime-config.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/auth.js"></script>
  </head>
  <body class="page-auth page-login">
    <div class="auth-container">
      <div class="auth-box">
        <div class="auth-logo">
          <div class="logo-icon">Degree Recommender</div>
        </div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to continue to your degree recommendations</p>

        <div class="alert alert-error" id="errorAlert"></div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" />
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label for="password" style="margin-bottom:0;">Password</label>
            <a href="forgot-password.html" style="font-size:0.85rem; color:#818cf8; text-decoration:none;">Forgot password?</a>
          </div>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            style="margin-top:6px;"
          />
        </div>

        <button class="btn btn-primary" onclick="login()">Login</button>

        <div class="auth-link">
          Do not have an account?
          <a href="register.html">Register here</a>
        </div>
      </div>
    </div>

    <script>
      const { apiFetch, redirectIfAuthenticated } = window.AUTH_CLIENT

      redirectIfAuthenticated()

      async function login() {
        const email = document.getElementById('email').value.trim()
        const password = document.getElementById('password').value
        const errorAlert = document.getElementById('errorAlert')

        errorAlert.style.display = 'none'

        if (!email || !password) {
          errorAlert.style.display = 'block'
          errorAlert.textContent = 'Please fill in all fields.'
          return
        }

        try {
          const data = await apiFetch('/auth/login', {
            method: 'POST',
            body: { email, password },
          })

          if (data.role === 'admin') {
            showAppAlert('Admin login successful.', 'success')
            window.location.href = 'admin-dashboard.html'
          } else {
            showAppAlert('Login successful.', 'success')
            window.location.href = 'dashboard.html'
          }
        } catch (error) {
          errorAlert.style.display = 'block'
          errorAlert.textContent =
            error.data?.message || 'Server error. Make sure backend is running.'
          showAppAlert(errorAlert.textContent, 'error')
        }
      }

      document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') login()
      })
    </script>
  </body>
</html>
