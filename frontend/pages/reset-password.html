<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set New Password - Degree Recommender</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/runtime-config.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/auth.js"></script>
  </head>
  <body class="page-auth">
    <div class="auth-container">
      <div class="auth-box">
        <div class="auth-logo">
          <div class="logo-icon">Degree Recommender</div>
        </div>
        <h2>Set New Password</h2>
        <p class="subtitle">Enter your reset token and choose a new password.</p>

        <div class="alert alert-error" id="errorAlert" style="display:none;"></div>
        <div class="alert alert-success" id="successAlert" style="display:none;"></div>

        <div id="resetForm">
          <div class="form-group">
            <label for="token">Reset Token</label>
            <input type="text" id="token" placeholder="Paste your 64-character token" />
          </div>

          <div class="form-group">
            <label for="password">New Password (at least 6 characters)</label>
            <input type="password" id="password" placeholder="Enter new password" />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter new password" />
          </div>

          <button class="btn btn-primary" id="submitBtn" onclick="submitNewPassword()">Update Password</button>
        </div>

        <div class="auth-link" style="margin-top:20px;">
          Back to <a href="login.html">Login</a>
        </div>
      </div>
    </div>

    <script>
      const { apiFetch } = window.AUTH_CLIENT

      // Auto-populate token from URL query param if present
      const urlParams = new URLSearchParams(window.location.search)
      const queryToken = urlParams.get('token')
      if (queryToken) {
        document.getElementById('token').value = queryToken
      }

      async function submitNewPassword() {
        const token = document.getElementById('token').value.trim()
        const password = document.getElementById('password').value
        const confirmPassword = document.getElementById('confirmPassword').value
        const errorAlert = document.getElementById('errorAlert')
        const successAlert = document.getElementById('successAlert')
        const submitBtn = document.getElementById('submitBtn')

        errorAlert.style.display = 'none'
        successAlert.style.display = 'none'

        if (!token || !password || !confirmPassword) {
          errorAlert.style.display = 'block'
          errorAlert.textContent = 'Please fill in all fields.'
          return
        }

        if (password.length < 6) {
          errorAlert.style.display = 'block'
          errorAlert.textContent = 'Password must be at least 6 characters long.'
          return
        }

        if (password !== confirmPassword) {
          errorAlert.style.display = 'block'
          errorAlert.textContent = 'Passwords do not match.'
          return
        }

        try {
          submitBtn.disabled = true
          submitBtn.textContent = 'Updating...'

          const data = await apiFetch('/auth/reset-password', {
            method: 'POST',
            body: { token, password },
          })

          successAlert.style.display = 'block'
          successAlert.textContent = data.message || 'Password reset successfully!'
          showAppAlert('Password updated successfully!', 'success')

          setTimeout(() => {
            window.location.href = 'login.html'
          }, 1500)
        } catch (error) {
          errorAlert.style.display = 'block'
          errorAlert.textContent = error.data?.message || 'Failed to reset password. Token may be invalid or expired.'
          showAppAlert(errorAlert.textContent, 'error')
        } finally {
          submitBtn.disabled = false
          submitBtn.textContent = 'Update Password'
        }
      }
    </script>
  </body>
</html>
